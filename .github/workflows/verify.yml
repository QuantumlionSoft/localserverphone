name: Pocket PaaS Verification & APK Build

on:
  push:
    branches: [ main, "arena/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

# Build and validation jobs are read-only by default. Release permissions are
# granted only to the dedicated publication job below.
permissions:
  contents: read

jobs:
  schema-and-policy-checks:
    name: SQLite Schema v5 & Policy Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify legacy Room v4 SQLite migration chain
        run: python3 verification/database/test_schema_v4.py
      - name: Verify Room v5 custom-hostname schema and migration
        run: python3 verification/database/test_schema_v5.py
      - name: Verify SSH and Service policy invariants
        run: python3 verification/database/test_policies.py
      - name: Verify bounded runtime site-file operations
        run: PYTHONDONTWRITEBYTECODE=1 python3 verification/runtime-files/test_files.py
      - name: Verify Backup HMAC, CSV formula guard and Remote API contracts
        run: python3 verification/database/test_backup_and_logs.py

  room-jvm-and-apk-build:
    name: Room JVM Tests & Debug APK Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Room JVM KSP & Unit Tests
        id: room_jvm
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew -p verification/room-jvm test 2>&1 | tee room-jvm.log
      - name: Install Android SDK Platform 36 & Build Tools 35.0.0
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Run Android Unit Tests, Lint & Assemble Debug APK
        id: android_build
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee android-build.log
      - name: Validate version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app_version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          expected_tag="v${app_version}-debug"
          if [[ -z "$app_version" || "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match expected '$expected_tag'." >&2
            exit 1
          fi
      - name: Stage tested debug APK for release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && steps.room_jvm.outcome == 'success' && steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pocketpaas-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload pull-request debug APK for review
        if: github.event_name == 'pull_request' && steps.room_jvm.outcome == 'success' && steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pocketpaas-debug-apk-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Report Build Diagnostics to Issue
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### CI Build & Test Report (\`${GITHUB_SHA::7}\`)"
            echo "- Room-JVM outcome: **${{ steps.room_jvm.outcome }}**"
            echo "- Android APK build outcome: **${{ steps.android_build.outcome }}**"
            if [ -f room-jvm.log ]; then
              echo "#### Room-JVM Compiler/Test Messages"
              echo '```text'
              grep -E "^e:|^w:|FAILURE:|FAILED|> Task|Exception|Error" room-jvm.log | tail -n 80 || true
              echo "--- tail ---"
              tail -n 40 room-jvm.log
              echo '```'
            fi
            if [ -f android-build.log ]; then
              echo "#### Android Build Compiler/Test/Lint Messages"
              echo '```text'
              grep -E "^e:|^w:|FAILURE:|FAILED|> Task|Exception|Error" android-build.log | tail -n 100 || true
              echo "--- tail ---"
              tail -n 40 android-build.log
              echo '```'
            fi
          } > report.md
          gh api repos/${GITHUB_REPOSITORY}/issues/1/comments -f body="$(cat report.md)" || true
      - name: Enforce Build Success
        run: |
          if [ "${{ steps.room_jvm.outcome }}" != "success" ] || [ "${{ steps.android_build.outcome }}" != "success" ]; then
            exit 1
          fi

  publish-debug-apk:
    name: Publish Versioned Debug APK
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ schema-and-policy-checks, room-jvm-and-apk-build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pocketpaas-debug-apk
          path: release-artifacts
      - name: Create immutable version release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk_name="PocketPaaS-${version}.apk"
          test -f release-artifacts/app-debug.apk
          cp release-artifacts/app-debug.apk "$apk_name"
          gh release create "$GITHUB_REF_NAME" "$apk_name" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pocket PaaS ${version}" \
            --notes "Tested Pocket PaaS debug APK for ${version}." \
            --verify-tag
